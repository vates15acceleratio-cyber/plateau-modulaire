name: Tests

on:
  push:
  pull_request:

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # PyMuPDF : sans lui, les 7 tests de rendu des PDF sont sautés.
      - run: pip install pymupdf
      # Les recettes navigateur (outils/recette-*.html) restent manuelles.
      - run: node --test
