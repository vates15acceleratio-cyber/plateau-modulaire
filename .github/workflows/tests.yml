name: Tests

on:
  push:
  pull_request:

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Les recettes navigateur (outils/recette-*.html) restent manuelles.
      - run: node --test
