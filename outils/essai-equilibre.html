<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Essai : rapport d'équilibre</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/equilibre.css">
  <style>
    /* Mise en page de l'essai seulement */
    body { display: block; height: auto; padding: 12px; }
    #erreurs { color: #c0261a; font-weight: 600; }
  </style>
  <!-- Capture des erreurs JavaScript dans #erreurs (avant tout autre script). -->
  <script>
    window.onerror = function (message, source, ligne) {
      var zone = document.getElementById('erreurs');
      if (zone) zone.textContent += (zone.textContent ? '\n' : '') + 'Erreur : ' + message + ' (ligne ' + ligne + ')';
    };
  </script>
</head>
<body>
  <p>Essai du module « rapport d'équilibre » seul : plateau du catalogue (graine fixe), 7 villes et 2 carrefours.</p>
  <p id="erreurs"></p>
  <p><button type="button" id="ouvrir">Rapport d'équilibre</button></p>

  <!-- Boîte de dialogue commune, copie de index.html -->
  <dialog id="dialogue" class="pm-dialogue" aria-labelledby="dialogue-titre">
    <header class="pm-dialogue-entete"><h2 id="dialogue-titre"></h2><button type="button" id="dialogue-fermer" aria-label="Fermer">✕</button></header>
    <div id="dialogue-contenu" class="pm-dialogue-contenu"></div>
  </dialog>

  <script src="../src/geometrie.js"></script>
  <script src="../src/modele.js"></script>
  <script src="../src/catalogue.js"></script>
  <script src="../src/etat.js"></script>
  <script src="../src/graphe.js"></script>
  <script src="../src/equilibre.js"></script>
  <script>
    (function () {
      var PM_ = globalThis.PM, M = PM_.modele;

      // PM.dialogue minimal (le vrai est défini par app.js, non chargé ici)
      PM_.dialogue = {
        ouvrir: function (titre) {
          var d = document.getElementById('dialogue'), c = document.getElementById('dialogue-contenu');
          document.getElementById('dialogue-titre').textContent = titre || '';
          c.innerHTML = '';
          if (typeof d.showModal === 'function') { if (!d.open) d.showModal(); } else d.setAttribute('open', '');
          return c;
        },
        fermer: function () { var d = document.getElementById('dialogue'); if (d.open) d.close(); }
      };
      document.getElementById('dialogue-fermer').addEventListener('click', function () { PM_.dialogue.fermer(); });

      // Tirage reproductible (mulberry32, graine fixe) d'un plateau complet du catalogue
      function mulberry32(a) {
        return function () {
          a = (a + 0x6D2B79F5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rng = mulberry32(20261015);
      var doc = PM_.catalogue.nouveauDocument();
      var stock = {};
      doc.modeles.forEach(function (m) {
        stock[m.role] = stock[m.role] || [];
        for (var k = 0; k < m.exemplaires; k++) stock[m.role].push(m.id);
      });
      M.cellulesActives(doc.plateau.forme).forEach(function (c) {
        var role = M.roleCellule(c.col, c.lig, doc.plateau.forme);
        var id = stock[role].splice(Math.floor(rng() * stock[role].length), 1)[0];
        doc = M.poserTuile(doc, id, c.col, c.lig);
        if (role === 'centrale') { var r = Math.floor(rng() * 4); if (r) doc = M.tournerTuile(doc, c.col, c.lig, r); }
      });
      for (var j = 1; j <= 3; j++) {
        for (var i = 1; i <= 3; i++) {
          doc = M.poserJeton(doc, i, j, (j === 2 && i !== 2) ? 'carrefour' : 'capture');
        }
      }

      var etat = PM_.etat.creer(doc);
      document.getElementById('ouvrir').addEventListener('click', function () { PM_.equilibre.ouvrir(etat); });
      PM_.equilibre.ouvrir(etat); // ouverture directe, pour le contrôle du DOM
    })();
  </script>
</body>
</html>
