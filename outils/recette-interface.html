<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recette de l'interface (scénarios navigateur)</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/editeur-tuile.css">
  <link rel="stylesheet" href="../styles/assemblage.css">
  <link rel="stylesheet" href="../styles/controles.css">
  <style>
    #recette { position: fixed; right: 0; bottom: 0; width: 46vw; max-height: 45vh; overflow: auto; background: #fffbe6; border: 1px solid #999; font: 11px/1.3 monospace; z-index: 99999; pointer-events: none; padding: 4px; }
    #erreurs { color: #c0261a; white-space: pre-wrap; }
    #rapport { white-space: pre-wrap; margin: 0; }
  </style>
</head>
<body>
  <!-- Même coquille que index.html -->
  <header id="barre" class="pm-barre">
    <strong class="pm-titre">Plateau modulaire</strong>
    <nav class="pm-onglets" role="tablist">
      <button type="button" role="tab" data-onglet="plateau">Plateau</button>
      <button type="button" role="tab" data-onglet="tuiles">Tuiles</button>
    </nav>
    <div class="pm-actions">
      <button type="button" id="btn-annuler" title="Annuler (Ctrl+Z)">↶ Annuler</button>
      <button type="button" id="btn-retablir" title="Rétablir (Ctrl+Y)">Rétablir ↷</button>
      <button type="button" id="btn-ouvrir" title="Ouvrir un fichier JSON">Ouvrir</button>
      <button type="button" id="btn-enregistrer" title="Enregistrer en JSON (Ctrl+S)">Enregistrer</button>
      <button type="button" id="btn-exporter" title="Exporter pour impression" disabled>Exporter</button>
    </div>
    <span id="pastille-alertes" class="pm-pastille" hidden></span>
  </header>
  <main class="pm-principal">
    <aside id="bibliotheque" class="pm-colonne-gauche" aria-label="Bibliothèque de tuiles"></aside>
    <section id="ecran-plateau" class="pm-ecran" data-ecran="plateau">
      <div id="assemblage" class="pm-zone-centrale"></div>
      <aside id="controles" class="pm-colonne-droite" aria-label="Compteurs et alertes"></aside>
    </section>
    <section id="ecran-tuiles" class="pm-ecran" data-ecran="tuiles" hidden>
      <div id="editeur" class="pm-zone-editeur"></div>
    </section>
  </main>
  <footer id="barre-etat" class="pm-barre-etat" role="status" aria-live="polite"></footer>

  <div id="recette"><div id="erreurs"></div><pre id="rapport"></pre></div>

  <script>
    // Capture des erreurs JavaScript et des console.error
    (function () {
      function noter(t) { var e = document.getElementById('erreurs'); if (e) e.textContent += 'ERREUR JS : ' + t + '\n'; }
      window.onerror = function (msg, src, ligne) { noter(msg + ' (' + (src || '').split('/').pop() + ':' + ligne + ')'); };
      window.addEventListener('unhandledrejection', function (ev) { noter('promesse rejetée : ' + (ev.reason && ev.reason.message || ev.reason)); });
      var ce = console.error;
      console.error = function () { noter('console.error : ' + Array.prototype.map.call(arguments, function (a) { return a && a.message ? a.message : String(a); }).join(' ')); ce.apply(console, arguments); };
      // La sauvegarde automatique de l'utilisateur (même origine en file://) est mise de côté puis
      // remise en place à la fermeture de la page (audit de sécurité, point 10).
      // La remise en place doit passer APRÈS l'écouteur « pagehide » d'app.js (qui écrit l'autosave de la recette) :
      // elle est inscrite au « load », donc après le démarrage de l'application, par une fonction enveloppe distincte.
      try {
        var cleUtil = 'plateau-modulaire:autosave', copieUtil = localStorage.getItem(cleUtil);
        localStorage.removeItem(cleUtil);
        var remettreAutosaveUtilisateur = function () {
          try { if (copieUtil !== null) localStorage.setItem(cleUtil, copieUtil); else localStorage.removeItem(cleUtil); } catch (e) { /* rien */ }
        };
        window.addEventListener('load', function () {
          window.addEventListener('pagehide', function remiseEnPlaceApresApp() { remettreAutosaveUtilisateur(); });
        });
      } catch (e) { noter('localStorage inaccessible : ' + e.message); }
    })();
  </script>
  <script src="../src/geometrie.js"></script>
  <script src="../src/modele.js"></script>
  <script src="../src/catalogue.js"></script>
  <script src="../src/rendu.js"></script>
  <script src="../src/etat.js"></script>
  <script src="../src/sauvegarde.js"></script>
  <script src="../src/controles.js"></script>
  <script src="../src/bibliotheque.js"></script>
  <script src="../src/assemblage.js"></script>
  <script src="../src/editeur-tuile.js"></script>
  <script src="../src/app.js"></script>
  <script>
  window.addEventListener('load', function () {
    var M = PM.modele, G = PM.geometrie, A = PM.assemblage, E = PM.editeurTuile;
    var etat = PM.app && PM.app.etat;
    var rapportEl = document.getElementById('rapport');
    var nOk = 0, nEchec = 0;
    function $(id) { return document.getElementById(id); }
    function ctrl(nom, cond, detail) {
      if (cond) { nOk++; rapportEl.textContent += 'OK     ' + nom + '\n'; }
      else { nEchec++; rapportEl.textContent += 'ÉCHEC  ' + nom + (detail !== undefined ? '  [' + detail + ']' : '') + '\n'; }
    }
    function titre(t) { rapportEl.textContent += '--- ' + t + '\n'; }
    function J(o) { return JSON.stringify(o); }
    function canon(o) {
      if (Array.isArray(o)) return o.map(canon);
      if (o && typeof o === 'object') { var r = {}; Object.keys(o).sort().forEach(function (k) { r[k] = canon(o[k]); }); return r; }
      return o;
    }
    function CJ(o) { return J(canon(o)); }
    function docJ() { return CJ(etat.doc()); }
    function msg() { return $('barre-etat').textContent; }
    function niveau() { return $('barre-etat').getAttribute('data-niveau'); }
    function uneSeulePhrase(t) { return t.length > 0 && !/[.!?]\s+\S/.test(t.trim()); }
    function attendre(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function ptr(type, cible, x, y, id) {
      cible.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: id || 7, pointerType: 'mouse', button: 0, isPrimary: true }));
    }
    function touche(key, opts, cible) {
      var o = Object.assign({ key: key, bubbles: true, cancelable: true }, opts || {});
      (cible || document.body).dispatchEvent(new KeyboardEvent('keydown', o));
    }
    function ctrlZ() { touche('z', { ctrlKey: true }); }
    function ctrlY() { touche('y', { ctrlKey: true }); }
    function reset(doc) {
      etat.remplacer(doc || PM.catalogue.nouveauDocument());
      etat.majUi({ onglet: 'plateau', modeleSelectionne: null, surbrillance: null, aPoser: null });
      etat.signaler('', 'info');
    }
    function rectPlateau() { return document.querySelector('#assemblage svg').getBoundingClientRect(); }
    function ecranMm(x, y) { return A.mmVersEcran(x, y, rectPlateau(), A.VUE); }
    function centre(col, lig) { return ecranMm(col * 120 + 60, lig * 120 + 60); }
    /** Glisser-déposer d'un modèle de la bibliothèque vers (col, lig) ; `quarts` appuis sur R pendant le glissement. */
    function glisser(id, col, lig, quarts, horsPlateau) {
      var img = document.querySelector('.pm-biblio-image[data-glisser="' + id + '"]');
      if (!img) return { demarre: false };
      var r = img.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
      ptr('pointerdown', img, x0, y0);
      ptr('pointermove', document, x0 + 12, y0);
      var demarre = !!document.querySelector('.pm-assemblage-glisse');
      var p = horsPlateau ? { x: 2, y: 2 } : centre(col, lig);
      ptr('pointermove', document, p.x, p.y);
      for (var k = 0; k < (quarts || 0); k++) touche('r');
      ptr('pointerup', document, p.x, p.y);
      return { demarre: demarre };
    }
    function cliquerCellule(col, lig) {
      var z = document.querySelector('[data-cellule="' + col + ',' + lig + '"] .pm-assemblage-zone');
      var p = centre(col, lig);
      ptr('pointerdown', z, p.x, p.y); ptr('pointerup', document, p.x, p.y);
    }
    function cliquerJonction(i, j) {
      var z = document.querySelector('[data-jonction="' + i + ',' + j + '"] .pm-assemblage-zone-jonction');
      var p = ecranMm(i * 120, j * 120);
      ptr('pointerdown', z, p.x, p.y); ptr('pointerup', document, p.x, p.y);
    }
    function compteurs() {
      var o = {};
      document.querySelectorAll('.pm-controles-compteur').forEach(function (li) {
        var l = li.querySelector('.pm-controles-libelle').textContent;
        o[l] = { v: li.querySelector('.pm-controles-valeur').textContent, ok: /--ok/.test(li.className) };
      });
      return o;
    }
    function nbTuiles() { return etat.doc().plateau.tuiles.length; }
    function pastille() { return $('pastille-alertes').textContent; }

    // Plateau complet « bien placé » (affectation trouvée par recherche : 0 alerte avec le catalogue réel)
    var AFFECT = ['K5','A1','A2','K3','B1','C1','C5','B4','B3','C2','C4','B5','K1','A1','A2','K4'];
    var ROTS = [0,0,0,0,0,1,3,0,0,0,1,0,0,0,0,0];

    function assemblerComplet() {
      var cells = M.cellulesActives(etat.doc().plateau.forme);
      cells.forEach(function (c, k) { glisser(AFFECT[k], c.col, c.lig, ROTS[k]); });
    }
    var JETONS = [[1,1,1],[2,1,1],[3,1,1],[1,2,2],[2,2,1],[3,2,2],[1,3,1],[2,3,1],[3,3,1]];

    var docComplet = null;

    /* ============================================================== */
    function s0_chargement() {
      titre('S0 chargement');
      ['bibliotheque', 'assemblage', 'controles', 'editeurTuile', 'sauvegarde', 'app'].forEach(function (n) { ctrl('module PM.' + n + ' présent', !!PM[n]); });
      ctrl('aucun module absent dans la coquille', !document.querySelector('.pm-module-absent'));
      ctrl('bibliothèque : 18 vignettes', document.querySelectorAll('.pm-biblio-vignette').length === 18, document.querySelectorAll('.pm-biblio-vignette').length);
      ctrl('plateau : 16 cellules et 9 jonctions', document.querySelectorAll('[data-cellule]').length === 16 && document.querySelectorAll('[data-jonction]').length === 9);
      ctrl('onglet Plateau sélectionné, écran Tuiles caché', document.querySelector('[data-onglet="plateau"]').getAttribute('aria-selected') === 'true' && $('ecran-tuiles').hidden);
      ctrl('Annuler / Rétablir désactivés au départ', $('btn-annuler').disabled && $('btn-retablir').disabled);
      ctrl('pastille « Plateau incomplet » au départ', pastille() === 'Plateau incomplet', pastille());
      ctrl('document initial = catalogue (pas de reprise)', etat.doc().modeles.length === 18 && nbTuiles() === 0);
    }

    function s1_assemblage() {
      titre('S1 assemblage complet par glisser-déposer');
      reset();
      var cells = M.cellulesActives(etat.doc().plateau.forme);
      var tousOk = true, rotsOk = true, details = [];
      cells.forEach(function (c, k) {
        var avant = nbTuiles();
        var g = glisser(AFFECT[k], c.col, c.lig, ROTS[k]);
        if (!g.demarre || nbTuiles() !== avant + 1) { tousOk = false; details.push(AFFECT[k] + '@' + c.col + ',' + c.lig + ' : ' + msg()); }
        var t = M.tuileEn(etat.doc(), c.col, c.lig);
        var role = M.roleCellule(c.col, c.lig, etat.doc().plateau.forme);
        if (t) {
          if (role === 'centrale' && t.rot !== ROTS[k]) { rotsOk = false; details.push('rot centrale ' + t.rot + '/' + ROTS[k]); }
        }
      });
      ctrl('16 poses réussies par glisser-déposer', tousOk && nbTuiles() === 16, details.join(' | '));
      ctrl('rotation R pendant le glissement appliquée aux centrales', rotsOk, details.join(' | '));
      // rotations déduites (oracle : docs/2-avis-geometrie.md, coin exposé N+O en rot 0, bord/apparition exposé N en rot 0)
      var ora = { '0,0': 0, '3,0': 1, '3,3': 2, '0,3': 3, '0,1': 3, '0,2': 3, '3,1': 1, '3,2': 1, '1,0': 0, '2,0': 0, '1,3': 2, '2,3': 2 };
      var mauvais = [];
      etat.doc().plateau.tuiles.forEach(function (t) { var k = t.col + ',' + t.lig; if (k in ora && ora[k] !== t.rot) mauvais.push(k + ':' + t.rot + '/' + ora[k]); });
      ctrl('rotations automatiques des coins, bords, apparitions', mauvais.length === 0, mauvais.join(' '));
      var cp = compteurs();
      ctrl('compteur Tuiles posées 16 / 16', cp['Tuiles posées'] && cp['Tuiles posées'].v === '16 / 16', cp['Tuiles posées'] && cp['Tuiles posées'].v);
      ctrl('pastille « Plateau incomplet » avant les jetons', pastille() === 'Plateau incomplet', pastille());
      var msgs = [];
      JETONS.forEach(function (j) {
        for (var n = 0; n < j[2]; n++) cliquerJeton(j[0], j[1]);
      });
      function cliquerJeton(i, j) { cliquerJonction(i, j); }
      ctrl('9 jetons posés (7 villes, 2 carrefours)', etat.doc().plateau.jetons.length === 9 &&
        etat.doc().plateau.jetons.filter(function (x) { return x.type === 'capture'; }).length === 7 &&
        etat.doc().plateau.jetons.filter(function (x) { return x.type === 'carrefour'; }).length === 2, J(etat.doc().plateau.jetons));
      cp = compteurs();
      var pasOk = Object.keys(cp).filter(function (k) { return !cp[k].ok; }).map(function (k) { return k + '=' + cp[k].v; });
      ctrl('tous les compteurs à « ok »', pasOk.length === 0, pasOk.join(', '));
      ctrl('pastille « Plateau complet »', pastille() === 'Plateau complet' && $('pastille-alertes').classList.contains('pm-ok'), pastille());
      ctrl('panneau : « Aucune erreur ni alerte. »', !!document.querySelector('.pm-controles-vide'));
      ctrl('compteur d\'écran « Jetons posés 9/9 »', /Jetons posés 9\/9/.test(document.querySelector('[data-role="jetons"]').textContent));
      var ctrlPlat = M.validerPlateau(etat.doc());
      ctrl('validerPlateau : aucune erreur', ctrlPlat.erreurs.length === 0, J(ctrlPlat.erreurs));
      docComplet = JSON.parse(J(etat.doc()));
    }

    function s2_refus() {
      titre('S2 refus');
      reset();
      var avant = docJ(), g;
      g = glisser('K1', 1, 1);
      ctrl('mauvais rôle (coin sur centrale) : refusé, document inchangé', docJ() === avant && g.demarre, g.demarre);
      ctrl('mauvais rôle : message d\'erreur en une phrase dans #barre-etat', niveau() === 'erreur' && /attend/.test(msg()) && uneSeulePhrase(msg()), msg());
      glisser('C1', 0, 0);
      ctrl('centrale sur coin : refusée', docJ() === avant && niveau() === 'erreur', msg());
      glisser('A1', 0, 1);
      ctrl('apparition sur bord : refusée', docJ() === avant && niveau() === 'erreur', msg());
      g = glisser('K1', 0, 0);
      ctrl('pose K1 en (0,0) acceptée', nbTuiles() === 1, msg());
      var apres1 = docJ();
      glisser('K2', 0, 0);
      ctrl('cellule occupée : refusée, document inchangé', docJ() === apres1 && /occupée/.test(msg()) && uneSeulePhrase(msg()), msg());
      glisser('K1', 3, 0);
      ctrl('exemplaire épuisé : refusé, document inchangé', docJ() === apres1 && /exemplaire/.test(msg()) && uneSeulePhrase(msg()), msg());
      var vig = document.querySelector('[data-vignette="K1"]');
      ctrl('vignette K1 grisée (épuisée) et bouton Poser désactivé', vig.classList.contains('pm-biblio-epuise') && vig.querySelector('[data-action="poser"]').disabled);
      ctrl('libellé « ×0 restant » sur K1', /×0 restant/.test(vig.textContent), vig.textContent);
      etat.signaler('', 'info');
      glisser('K2', 0, 0, 0, true);
      ctrl('lâcher hors plateau : pose annulée avec message', docJ() === apres1 && /annulée/.test(msg()), msg());
      // modèle incomplet : créé par l'éditeur
      var ids0 = etat.doc().modeles.length;
      boutonRole('Coin').click();
      var nid = etat.ui().modeleSelectionne;
      ctrl('modèle incomplet créé', etat.doc().modeles.length === ids0 + 1 && !M.validerModele(M.modeleParId(etat.doc(), nid)).complet);
      etat.majUi({ onglet: 'plateau' });
      var av2 = docJ();
      etat.signaler('', 'info');
      var g2 = glisser(nid, 3, 0);
      ctrl('modèle incomplet : aucune pose', docJ() === av2);
      ctrl('modèle incomplet : le refus est expliqué dans #barre-etat', msg().length > 0 && /incomplet/i.test(msg()), 'glissement démarré=' + g2.demarre + ', message=«' + msg() + '»');
      ctrl('modèle incomplet : bouton Poser désactivé', document.querySelector('[data-vignette="' + nid + '"] [data-action="poser"]').disabled);
      // pose en deux clics
      reset();
      document.querySelector('[data-vignette="K1"] [data-action="poser"]').click();
      ctrl('« Poser » arme le modèle (aPoser)', etat.ui().aPoser === 'K1');
      cliquerCellule(1, 1);
      ctrl('deux clics : cellule de mauvais rôle refusée, modèle toujours armé', nbTuiles() === 0 && etat.ui().aPoser === 'K1' && niveau() === 'erreur', msg());
      cliquerCellule(0, 0);
      ctrl('deux clics : pose en (0,0), armement levé', nbTuiles() === 1 && !etat.ui().aPoser, msg());
      document.querySelector('[data-vignette="K2"] [data-action="poser"]').click();
      touche('Escape');
      ctrl('Échap désarme', !etat.ui().aPoser);
      // exemplaires +/-
      var K3 = M.modeleParId(etat.doc(), 'K3').exemplaires;
      document.querySelector('[data-vignette="K3"] [data-action="plus"]').click();
      ctrl('bouton + : exemplaires +1', M.modeleParId(etat.doc(), 'K3').exemplaires === K3 + 1);
      document.querySelector('[data-vignette="K3"] [data-action="moins"]').click();
      document.querySelector('[data-vignette="K3"] [data-action="moins"]').click();
      ctrl('bouton − : retour à ' + K3 + ' puis ' + (K3 - 1), M.modeleParId(etat.doc(), 'K3').exemplaires === K3 - 1);
      // retirer en dessous du posé
      document.querySelector('[data-vignette="K1"] [data-action="moins"]').click();
      ctrl('− sous le nombre de tuiles posées : refusé avec message', M.modeleParId(etat.doc(), 'K1').exemplaires === 1 && niveau() === 'erreur', msg());
      // filtre
      var sel = document.querySelector('[data-role="filtre"]');
      sel.value = 'coin'; sel.dispatchEvent(new Event('change', { bubbles: true }));
      ctrl('filtre « Coins » : 5 vignettes', document.querySelectorAll('.pm-biblio-vignette').length === 5, document.querySelectorAll('.pm-biblio-vignette').length);
      sel.value = 'tous'; sel.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function boutonRole(libelle) {
      return Array.prototype.filter.call(document.querySelectorAll('.pm-editeur-boutons-roles button'), function (b) { return b.textContent === libelle; })[0];
    }

    function s3_historique() {
      titre('S3 annuler / rétablir');
      reset();
      var s0 = docJ();
      glisser('C1', 1, 1);
      var s1 = docJ();
      ctrl('pose faite, Annuler actif', s1 !== s0 && !$('btn-annuler').disabled);
      ctrlZ();
      ctrl('Ctrl+Z : retour exact à l\'état vide', docJ() === s0 && !$('btn-retablir').disabled);
      ctrlY();
      ctrl('Ctrl+Y : retour exact à la pose', docJ() === s1);
      $('btn-annuler').click();
      ctrl('bouton Annuler', docJ() === s0);
      $('btn-retablir').click();
      ctrl('bouton Rétablir', docJ() === s1);
      ctrlZ(); touche('z', { ctrlKey: true, shiftKey: true });
      ctrl('Ctrl+Maj+Z rétablit', docJ() === s1);
      // rotation R
      cliquerCellule(1, 1);
      touche('r');
      var rot = M.tuileEn(etat.doc(), 1, 1).rot;
      ctrl('R pivote la centrale sélectionnée', rot === 1, rot);
      ctrlZ();
      ctrl('Ctrl+Z annule la rotation (état identique)', docJ() === s1);
      ctrlY();
      ctrl('Ctrl+Y refait la rotation', M.tuileEn(etat.doc(), 1, 1).rot === 1);
      ctrlZ();
      // jeton
      reset(docComplet ? Object.assign({}, docComplet, { plateau: Object.assign({}, docComplet.plateau, { jetons: [] }) }) : null);
      var sj0 = docJ();
      cliquerJonction(1, 1);
      var sj1 = docJ();
      ctrl('clic jonction : ville posée', etat.doc().plateau.jetons.length === 1 && etat.doc().plateau.jetons[0].type === 'capture', msg());
      cliquerJonction(1, 1);
      ctrl('2e clic : carrefour', etat.doc().plateau.jetons[0].type === 'carrefour');
      cliquerJonction(1, 1);
      ctrl('3e clic : jonction vide', etat.doc().plateau.jetons.length === 0);
      ctrlZ(); ctrlZ(); ctrlZ();
      ctrl('3 × Ctrl+Z : état initial exact', docJ() === sj0);
      ctrlY();
      ctrl('Ctrl+Y : ville de nouveau', docJ() === sj1);
      // changement de forme
      var avantForme = docJ();
      var selF = document.querySelector('[data-role="forme"]');
      selF.value = 'c00'; selF.dispatchEvent(new Event('change', { bubbles: true }));
      ctrl('forme sans coin NO : tuile (0,0) retirée', !M.tuileEn(etat.doc(), 0, 0) && nbTuiles() === 15, nbTuiles());
      ctrl('forme réduite : l\'effet est expliqué (tuile / jeton retiré, Ctrl+Z)', /retirée/.test(msg()) && /Ctrl\+Z/.test(msg()), msg());
      ctrlZ();
      ctrl('Ctrl+Z annule le changement de forme (identique)', docJ() === avantForme);
      ctrl('le sélecteur de forme revient à « complet »', selF.value === 'complet', selF.value);
      // éditeur
      reset();
      etat.majUi({ modeleSelectionne: 'K1', onglet: 'tuiles' });
      var sel = document.querySelector('.pm-editeur-canevas');
      var e0 = docJ();
      var c1 = M.modeleParId(etat.doc(), 'K1').cases[0];
      touche('ArrowLeft', {}, sel); // aucune sélection : sans effet
      ctrl('flèche sans sélection : sans effet', docJ() === e0);
      var p = E.mmVersEcran(c1.x, c1.y, sel.getBoundingClientRect(), E.VUE);
      ptr('pointerdown', sel, p.x, p.y); ptr('pointerup', sel, p.x, p.y);
      touche('ArrowLeft', {}, sel);
      var c1b = M.modeleParId(etat.doc(), 'K1').cases[0];
      ctrl('case sélectionnée déplacée vers la gauche par la flèche (aimantée sur la grille de 1 cm)', c1b.x < c1.x && c1b.x % 10 === 0 && c1b.y % 10 === 0, J(c1b) + ' avant ' + c1.x + ',' + c1.y);
      ctrlZ();

      ctrl('plateau complet assemblé par l\'interface : identique après aller-retour', CJ(r.doc) === CJ(etat.doc()));
      // fichier corrompu
      ['', '{', 'null', '[]', '{"format":"autre"}', '{"format":"plateau-modulaire","version":1,"modeles":"x"}', t.slice(0, t.length - 20)].forEach(function (mauvais, k) {
        var res;
        try { res = S.depuisJSON(mauvais); } catch (e) { res = { exception: e.message }; }
        ctrl('fichier corrompu #' + k + ' : pas d\'exception, ok:false ou ouvert prudemment', !res.exception && (res.ok === false ? (res.erreurs && res.erreurs.length && res.erreurs[0].message) : !!res.doc), J(res).slice(0, 120));
      });
      // message de l'app à l'ouverture d'un fichier illisible (simulation via ouvrirFichier)
      var orig = S.ouvrirFichier, avant = docJ();
      S.ouvrirFichier = function () { return Promise.resolve(S.depuisJSON('{')); };
      $('btn-ouvrir').click();
      return attendre(50).then(function () {
        ctrl('Ouvrir un fichier corrompu : message d\'erreur, document intact', niveau() === 'erreur' && docJ() === avant, msg());
        S.ouvrirFichier = function () { return Promise.resolve(S.depuisJSON(t)); };
        reset();
        $('btn-ouvrir').click();
        return attendre(50);
      }).then(function () {
        ctrl('Ouvrir un fichier valide : document remplacé', nbTuiles() === 16, nbTuiles());
        var apresOuv = docJ();
        ctrlZ();
        ctrl('Ouvrir est annulable (Ctrl+Z restaure le document précédent), Ctrl+Y rétablit', nbTuiles() === 0);
        ctrlY();
        ctrl("Ctrl+Y après l'annulation de l'ouverture", docJ() === apresOuv);
        S.ouvrirFichier = orig;
        // autosave différée (1 s)
        etat.signaler('', 'info');
        var s = S.versJSON(etat.doc());
        cliquerJonction(1, 1);
        return attendre(1300);
      }).then(function () {
        var brut = null; try { brut = localStorage.getItem(S.CLE_AUTOSAVE); } catch (e) { /* ignoré */ }
        ctrl('autosave écrite dans localStorage après modification', typeof brut === 'string', typeof brut);
        var rr = S.restaurerAutosave();
        ctrl('restaurerAutosave : ok, identique au document courant', rr && rr.ok && CJ(rr.doc) === docJ(), rr && J(rr).slice(0, 100));
        // remontage de l'application sur un nouvel état (simule le rechargement)
        var rest = S.restaurerAutosave();
        var nouveau = PM.etat.creer(rest.doc);
        var cont = {};
        ['bibliotheque', 'assemblage', 'controles', 'editeur'].forEach(function (n) { cont[n] = document.createElement('div'); document.body.appendChild(cont[n]); });
        PM.bibliotheque.monter(cont.bibliotheque, nouveau);
        PM.assemblage.monter(cont.assemblage, nouveau);
        PM.controles.monter(cont.controles, nouveau);
        PM.editeurTuile.monter(cont.editeur, nouveau);
        ctrl('remontage : 16 tuiles et 9 jetons dessinés', cont.assemblage.querySelectorAll('.pm-assemblage-occupee').length === 16 && cont.assemblage.querySelectorAll('.pm-assemblage-jeton').length === 9, cont.assemblage.querySelectorAll('.pm-assemblage-occupee').length);
        ctrl('remontage : bibliothèque de 18 vignettes et compteurs', cont.bibliotheque.querySelectorAll('.pm-biblio-vignette').length === 18 && cont.controles.querySelectorAll('.pm-controles-compteur').length === 9);
        ctrl('remontage : état neuf sans historique', !nouveau.peutAnnuler());
        // autosave illisible : ignorée
        localStorage.setItem(S.CLE_AUTOSAVE, '{pas du json');
        ctrl('autosave corrompue : restaurerAutosave renvoie null sans exception', S.restaurerAutosave() === null);
        S.effacerAutosave();
        ctrl('effacerAutosave', S.restaurerAutosave() === null);
        cont.bibliotheque.remove(); cont.assemblage.remove(); cont.controles.remove(); cont.editeur.remove();
      });
    }

    var chaine = Promise.resolve();
    function etape(f) { chaine = chaine.then(function () { try { return f(); } catch (e) { nEchec++; rapportEl.textContent += 'ÉCHEC  exception dans ' + f.name + ' : ' + (e && e.stack || e) + '\n'; } }); }
    if (!etat) { rapportEl.textContent = 'ÉCHEC  application non démarrée (PM.app.etat absent)\n'; nEchec++; }
    else {
      [s0_chargement, s1_assemblage, s2_refus, s3_historique, s4_editeur, s5_controles, s7_raccourcis, robustesse, s6_sauvegarde].forEach(etape);
    }
    chaine.then(function () {
      var nErr = (document.getElementById('erreurs').textContent.match(/ERREUR JS/g) || []).length;
      ctrl('aucune erreur JavaScript pendant tout le parcours', nErr === 0, nErr + ' erreur(s)');
      rapportEl.textContent += '=== TOTAL : ' + nOk + ' OK, ' + nEchec + ' ÉCHEC ===\n';
      document.title = 'FIN ' + nOk + ' OK / ' + nEchec + ' ECHEC';
    });
  });
  </script>
