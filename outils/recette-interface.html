<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recette de l'interface (scénarios navigateur, règles v2)</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/editeur-tuile.css">
  <link rel="stylesheet" href="../styles/assemblage.css">
  <link rel="stylesheet" href="../styles/controles.css">
  <style>
    #recette { position: fixed; right: 0; bottom: 0; width: 46vw; max-height: 45vh; overflow: auto; background: #fffbe6; border: 1px solid #999; font: 11px/1.3 monospace; z-index: 99999; pointer-events: none; padding: 4px; }
    #erreurs { color: #c0261a; white-space: pre-wrap; }
    #rapport { white-space: pre-wrap; margin: 0; }
  </style>
</head>
<body>
  <!-- Même coquille que index.html -->
  <header id="barre" class="pm-barre">
    <strong class="pm-titre">Plateau modulaire</strong>
    <nav class="pm-onglets" role="tablist">
      <button type="button" role="tab" data-onglet="plateau">Plateau</button>
      <button type="button" role="tab" data-onglet="tuiles">Tuiles</button>
    </nav>
    <span id="indicateur-grille" class="pm-grille" title="Format de grille de ce document"></span>
    <div class="pm-actions">
      <button type="button" id="btn-nouveau" title="Nouveau plateau : choisir la grille (4×4 ou 5×5)">Nouveau</button>
      <button type="button" id="btn-annuler" title="Annuler (Ctrl+Z)">↶ Annuler</button>
      <button type="button" id="btn-retablir" title="Rétablir (Ctrl+Y)">Rétablir ↷</button>
      <button type="button" id="btn-ouvrir" title="Ouvrir un fichier JSON">Ouvrir</button>
      <button type="button" id="btn-enregistrer" title="Enregistrer en JSON (Ctrl+S)">Enregistrer</button>
      <button type="button" id="btn-exporter" title="Exporter pour impression" disabled>Exporter</button>
    </div>
    <span id="pastille-alertes" class="pm-pastille" hidden></span>
  </header>
  <main class="pm-principal">
    <aside id="bibliotheque" class="pm-colonne-gauche" aria-label="Bibliothèque de tuiles"></aside>
    <section id="ecran-plateau" class="pm-ecran" data-ecran="plateau">
      <div id="assemblage" class="pm-zone-centrale"></div>
      <aside id="controles" class="pm-colonne-droite" aria-label="Compteurs et alertes"></aside>
    </section>
    <section id="ecran-tuiles" class="pm-ecran" data-ecran="tuiles" hidden>
      <div id="editeur" class="pm-zone-editeur"></div>
    </section>
  </main>
  <dialog id="dialogue" class="pm-dialogue" aria-labelledby="dialogue-titre">
    <header class="pm-dialogue-entete"><h2 id="dialogue-titre"></h2><button type="button" id="dialogue-fermer" aria-label="Fermer">✕</button></header>
    <div id="dialogue-contenu" class="pm-dialogue-contenu"></div>
  </dialog>
  <footer id="barre-etat" class="pm-barre-etat" role="status" aria-live="polite"></footer>

  <div id="recette"><div id="erreurs"></div><pre id="rapport"></pre></div>

  <script>
    // Capture des erreurs JavaScript et des console.error
    (function () {
      function noter(t) { var e = document.getElementById('erreurs'); if (e) e.textContent += 'ERREUR JS : ' + t + '\n'; }
      window.onerror = function (msg, src, ligne) { noter(msg + ' (' + (src || '').split('/').pop() + ':' + ligne + ')'); };
      window.addEventListener('unhandledrejection', function (ev) { noter('promesse rejetée : ' + (ev.reason && ev.reason.message || ev.reason)); });
      var ce = console.error;
      console.error = function () { noter('console.error : ' + Array.prototype.map.call(arguments, function (a) { return a && a.message ? a.message : String(a); }).join(' ')); ce.apply(console, arguments); };
      // La sauvegarde automatique de l'utilisateur (même origine en file://) est mise de côté puis
      // remise en place à la fermeture de la page (audit de sécurité, point 10).
      // La remise en place doit passer APRÈS l'écouteur « pagehide » d'app.js (qui écrit l'autosave de la recette) :
      // elle est inscrite au « load », donc après le démarrage de l'application, par une fonction enveloppe distincte.
      try {
        var cleUtil = 'plateau-modulaire:autosave', copieUtil = localStorage.getItem(cleUtil);
        localStorage.removeItem(cleUtil);
        var remettreAutosaveUtilisateur = function () {
          try { if (copieUtil !== null) localStorage.setItem(cleUtil, copieUtil); else localStorage.removeItem(cleUtil); } catch (e) { /* rien */ }
        };
        window.addEventListener('load', function () {
          window.addEventListener('pagehide', function remiseEnPlaceApresApp() { remettreAutosaveUtilisateur(); });
        });
      } catch (e) { noter('localStorage inaccessible : ' + e.message); }
    })();
  </script>
  <script src="../src/geometrie.js"></script>
  <script src="../src/modele.js"></script>
  <script src="../src/catalogue.js"></script>
  <script src="../src/rendu.js"></script>
  <script src="../src/etat.js"></script>
  <script src="../src/sauvegarde.js"></script>
  <script src="../src/graphe.js"></script>
  <script src="../src/controles.js"></script>
  <script src="../src/bibliotheque.js"></script>
  <script src="../src/assemblage.js"></script>
  <script src="../src/editeur-tuile.js"></script>
  <script src="../src/app.js"></script>
  <script src="../tests/aides-v2.js"></script>
  <script>
  window.addEventListener('load', function () {
    var M = PM.modele, G = PM.geometrie, A = PM.assemblage, E = PM.editeurTuile;
    var etat = PM.app && PM.app.etat;
    var rapportEl = document.getElementById('rapport');
    var nOk = 0, nEchec = 0;
    function $(id) { return document.getElementById(id); }
    function ctrl(nom, cond, detail) {
      if (cond) { nOk++; rapportEl.textContent += 'OK     ' + nom + '\n'; }
      else { nEchec++; rapportEl.textContent += 'ÉCHEC  ' + nom + (detail !== undefined ? '  [' + detail + ']' : '') + '\n'; }
    }
    function titre(t) { rapportEl.textContent += '--- ' + t + '\n'; }
    function J(o) { return JSON.stringify(o); }
    function canon(o) {
      if (Array.isArray(o)) return o.map(canon);
      if (o && typeof o === 'object') { var r = {}; Object.keys(o).sort().forEach(function (k) { r[k] = canon(o[k]); }); return r; }
      return o;
    }
    function CJ(o) { return J(canon(o)); }
    function docJ() { return CJ(etat.doc()); }
    function msg() { return $('barre-etat').textContent; }
    function niveau() { return $('barre-etat').getAttribute('data-niveau'); }
    function uneSeulePhrase(t) { return t.length > 0 && !/[.!?]\s+\S/.test(t.trim()); }
    function attendre(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function ptr(type, cible, x, y, id) {
      cible.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: id || 7, pointerType: 'mouse', button: 0, isPrimary: true }));
    }
    function touche(key, opts, cible) {
      var o = Object.assign({ key: key, bubbles: true, cancelable: true }, opts || {});
      (cible || document.body).dispatchEvent(new KeyboardEvent('keydown', o));
    }
    function ctrlZ() { touche('z', { ctrlKey: true }); }
    function ctrlY() { touche('y', { ctrlKey: true }); }
    function reset(doc) {
      etat.remplacer(doc || PM.catalogue.nouveauDocument());
      etat.majUi({ onglet: 'plateau', modeleSelectionne: null, surbrillance: null, aPoser: null });
      etat.signaler('', 'info');
    }
    function rectPlateau() { return document.querySelector('#assemblage svg').getBoundingClientRect(); }
    function formatCourant() { return M.formatDuDocument(etat.doc()); }
    function ecranMm(x, y) { return A.mmVersEcran(x, y, rectPlateau(), A.vuePour(formatCourant())); }
    function centre(col, lig) { var C = formatCourant().COTE; return ecranMm(col * C + C / 2, lig * C + C / 2); }
    /** Glisser-déposer d'un modèle de la bibliothèque vers (col, lig) ; `quarts` appuis sur R pendant le glissement. */
    function glisser(id, col, lig, quarts, horsPlateau) {
      var img = document.querySelector('.pm-biblio-image[data-glisser="' + id + '"]');
      if (!img) return { demarre: false };
      var r = img.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
      ptr('pointerdown', img, x0, y0);
      ptr('pointermove', document, x0 + 12, y0);
      var demarre = !!document.querySelector('.pm-assemblage-glisse');
      var p = horsPlateau ? { x: 2, y: 2 } : centre(col, lig);
      ptr('pointermove', document, p.x, p.y);
      for (var k = 0; k < (quarts || 0); k++) touche('r');
      ptr('pointerup', document, p.x, p.y);
      return { demarre: demarre };
    }
    function cliquerCellule(col, lig) {
      var z = document.querySelector('[data-cellule="' + col + ',' + lig + '"] .pm-assemblage-zone');
      var p = centre(col, lig);
      ptr('pointerdown', z, p.x, p.y); ptr('pointerup', document, p.x, p.y);
    }
    function cliquerJonction(i, j) {
      var z = document.querySelector('[data-jonction="' + i + ',' + j + '"] .pm-assemblage-zone-jonction');
      var p = ecranMm(i * formatCourant().COTE, j * formatCourant().COTE);
      ptr('pointerdown', z, p.x, p.y); ptr('pointerup', document, p.x, p.y);
    }
    function compteurs() {
      var o = {};
      document.querySelectorAll('.pm-controles-compteur').forEach(function (li) {
        var l = li.querySelector('.pm-controles-libelle').textContent;
        o[l] = { v: li.querySelector('.pm-controles-valeur').textContent, ok: /--ok/.test(li.className) };
      });
      return o;
    }
    function nbTuiles() { return etat.doc().plateau.tuiles.length; }
    function pastille() { return $('pastille-alertes').textContent; }

    var AV2 = PM.aidesV2;
    /** Bibliothèque d'exemples conformes v2 (3 modèles : ex-centrale, ex-bord, ex-coin). */
    function docExemples(grille) { return AV2.documentExemples(grille); }
    // Rotations suggérées (oracle : docs/2-avis-geometrie.md, côté extérieur canonique au nord, coin N + O)
    var ORA_ROT = { '0,0': 0, '3,0': 1, '3,3': 2, '0,3': 3, '0,1': 3, '0,2': 3, '3,1': 1, '3,2': 1, '1,0': 0, '2,0': 0, '1,3': 2, '2,3': 2 };
    function idCellule(col, lig) { return { centrale: 'ex-centrale', bord: 'ex-bord', coin: 'ex-coin' }[M.gabaritCellule(col, lig)]; }

    var docComplet = null;

    /* ============================================================== */
    function s0_chargement() {
      titre('S0 chargement');
      ['bibliotheque', 'assemblage', 'controles', 'editeurTuile', 'sauvegarde', 'graphe', 'app'].forEach(function (n) { ctrl('module PM.' + n + ' présent', !!PM[n]); });
      ctrl('aucun module absent dans la coquille', !document.querySelector('.pm-module-absent'));
      ctrl('bibliothèque : 14 vignettes (catalogue v2)', document.querySelectorAll('.pm-biblio-vignette').length === 14, document.querySelectorAll('.pm-biblio-vignette').length);
      ctrl('bibliothèque : 3 groupes (Centrales, Bords, Coins)', Array.prototype.map.call(document.querySelectorAll('.pm-biblio-groupe-titre'), function (h) { return h.textContent.split(' ')[0]; }).join(',') === 'Centrales,Bords,Coins');
      ctrl('plateau : 16 cellules et 9 jonctions', document.querySelectorAll('[data-cellule]').length === 16 && document.querySelectorAll('[data-jonction]').length === 9);
      ctrl('plateau : camps vert (nord) et rouge (sud)', /Camp vert \(nord\)/.test(document.querySelector('#assemblage svg').textContent) && /Camp rouge \(sud\)/.test(document.querySelector('#assemblage svg').textContent));
      ctrl('plus de sélecteur de forme', !document.querySelector('[data-role="forme"]'));
      ctrl('onglet Plateau sélectionné, écran Tuiles caché', document.querySelector('[data-onglet="plateau"]').getAttribute('aria-selected') === 'true' && $('ecran-tuiles').hidden);
      ctrl('Annuler / Rétablir désactivés au départ', $('btn-annuler').disabled && $('btn-retablir').disabled);
      ctrl('pastille « Plateau incomplet » au départ', pastille() === 'Plateau incomplet', pastille());
      ctrl('document initial = catalogue (pas de reprise), version 2, grille 4×4', etat.doc().modeles.length === 14 && nbTuiles() === 0 && etat.doc().version === 2 && etat.doc().grille === '4x4');
      ctrl('barre d\'état : message d\'accueil (catalogue v2 chargé, rien à signaler)', /Glissez une tuile/.test(msg()) && niveau() === 'info', msg());
    }

    function s1_assemblage() {
      titre('S1 assemblage complet par glisser-déposer (bibliothèque d\'exemples v2)');
      reset(docExemples());
      ctrl('bibliothèque : 3 vignettes', document.querySelectorAll('.pm-biblio-vignette').length === 3);
      var tousOk = true, details = [];
      for (var lig = 0; lig < 4; lig++) for (var col = 0; col < 4; col++) {
        var avant = nbTuiles(), quarts = col === 1 && lig === 1 ? 2 : 0;
        var g = glisser(idCellule(col, lig), col, lig, quarts);
        if (!g.demarre || nbTuiles() !== avant + 1) { tousOk = false; details.push(col + ',' + lig + ' : ' + msg()); }
      }
      ctrl('16 poses réussies par glisser-déposer', tousOk && nbTuiles() === 16, details.join(' | '));
      ctrl('R pendant le glissement : rotation choisie appliquée', M.tuileEn(etat.doc(), 1, 1).rot === 2, M.tuileEn(etat.doc(), 1, 1).rot);
      var mauvais = [];
      etat.doc().plateau.tuiles.forEach(function (t) { var k = t.col + ',' + t.lig; if (k in ORA_ROT && ORA_ROT[k] !== t.rot) mauvais.push(k + ':' + t.rot + '/' + ORA_ROT[k]); });
      ctrl('rotations suggérées des bords et coins (côté extérieur dehors)', mauvais.length === 0, mauvais.join(' '));
      var cp = compteurs();
      ctrl('compteur Tuiles posées 16 / 16', cp['Tuiles posées'] && cp['Tuiles posées'].v === '16 / 16', cp['Tuiles posées'] && cp['Tuiles posées'].v);
      ctrl('compteurs apparitions vert 6 / 6 et rouge 6 / 6', cp['Apparitions vert'].v === '6 / 6' && cp['Apparitions rouge'].v === '6 / 6', J(cp));
      ctrl('pastille « Plateau incomplet » avant les villes', pastille() === 'Plateau incomplet', pastille());
      ctrl('cases d\'apparition aux couleurs (et formes) de leur camp à l\'écran', document.querySelectorAll('#assemblage [data-apparition="vert"]').length === 6 && document.querySelectorAll('#assemblage [data-apparition="rouge"]').length === 6);
      AV2.VILLES['4x4'].forEach(function (v) { cliquerJonction(v[0], v[1]); });
      ctrl('7 villes posées en un clic chacune', etat.doc().plateau.jetons.length === 7 && etat.doc().plateau.jetons.every(function (x) { return x.type === 'capture'; }), J(etat.doc().plateau.jetons));
      cp = compteurs();
      var pasOk = Object.keys(cp).filter(function (k) { return !cp[k].ok; }).map(function (k) { return k + '=' + cp[k].v; });
      ctrl('tous les compteurs à « ok »', pasOk.length === 0, pasOk.join(', '));
      ctrl('compteur « Cases (tuiles et jonctions) » : 54 (≈ 60)', cp['Cases (tuiles et jonctions)'] && cp['Cases (tuiles et jonctions)'].v === '54 (≈ 60)', cp['Cases (tuiles et jonctions)'] && cp['Cases (tuiles et jonctions)'].v);
      ctrl('pastille « Plateau complet »', pastille() === 'Plateau complet' && $('pastille-alertes').classList.contains('pm-ok'), pastille());
      ctrl('panneau : « Aucune erreur ni alerte. »', !!document.querySelector('.pm-controles-vide'));
      ctrl('compteur d\'écran « Villes posées 7/7 »', /Villes posées 7\/7/.test(document.querySelector('[data-role="jetons"]').textContent));
      ctrl('validerPlateau : aucune erreur', M.validerPlateau(etat.doc()).erreurs.length === 0);
      docComplet = JSON.parse(J(etat.doc()));
    }

    function s2_refus() {
      titre('S2 pose libre et refus');
      reset();
      var avant = docJ(), g;
      g = glisser('K1', 1, 1);
      ctrl('pose libre : un coin sur une cellule centrale est accepté', nbTuiles() === 1 && g.demarre, msg());
      ctrl('pose libre : alerte « Tuiles hors de leur place » dans le panneau', Array.prototype.some.call(document.querySelectorAll('.pm-controles-sommaire-libelle'), function (e) { return /hors de leur place/.test(e.textContent); }));
      reset();
      g = glisser('K1', 0, 0);
      ctrl('pose K1 en (0,0) acceptée, rotation suggérée 0', nbTuiles() === 1 && M.tuileEn(etat.doc(), 0, 0).rot === 0, msg());
      glisser('K1', 3, 0);
      ctrl('2e exemplaire de K1 posé en (3,0) (K1 existe en 2 exemplaires)', nbTuiles() === 2 && M.tuileEn(etat.doc(), 3, 0).rot === 1, msg());
      var apres1 = docJ();
      glisser('K2', 0, 0);
      ctrl('cellule occupée : refusée, document inchangé, une phrase', docJ() === apres1 && /occupée/.test(msg()) && uneSeulePhrase(msg()) && niveau() === 'erreur', msg());
      glisser('K1', 3, 3);
      ctrl('exemplaire épuisé : refusé, document inchangé', docJ() === apres1 && /exemplaire/.test(msg()) && uneSeulePhrase(msg()), msg());
      var vig = document.querySelector('[data-vignette="K1"]');
      ctrl('vignette K1 grisée (épuisée) et bouton Poser désactivé', vig.classList.contains('pm-biblio-epuise') && vig.querySelector('[data-action="poser"]').disabled);
      ctrl('libellé « ×0 restant » sur K1', /×0 restant/.test(vig.textContent), vig.textContent);
      ctrl('aucun badge d\'alertes sur K1 (catalogue v2 : aucune alerte)', !/alerte/.test(vig.textContent), vig.textContent);
      etat.signaler('', 'info');
      glisser('K2', 0, 0, 0, true);
      ctrl('lâcher hors plateau : pose annulée avec message', docJ() === apres1 && /annulée/.test(msg()), msg());
      var ids0 = etat.doc().modeles.length;
      boutonRole('Coin').click();
      var nid = etat.ui().modeleSelectionne;
      ctrl('modèle incomplet créé (cases non reliées)', etat.doc().modeles.length === ids0 + 1 && !M.validerModele(M.modeleParId(etat.doc(), nid)).complet);
      etat.majUi({ onglet: 'plateau' });
      var av2 = docJ();
      etat.signaler('', 'info');
      var g2 = glisser(nid, 3, 0);
      ctrl('modèle incomplet : aucune pose', docJ() === av2);
      ctrl('modèle incomplet : le refus est expliqué dans #barre-etat', msg().length > 0 && /incomplet/i.test(msg()), 'glissement démarré=' + g2.demarre + ', message=«' + msg() + '»');
      ctrl('modèle incomplet : bouton Poser désactivé', document.querySelector('[data-vignette="' + nid + '"] [data-action="poser"]').disabled);
      reset();
      document.querySelector('[data-vignette="K1"] [data-action="poser"]').click();
      ctrl('« Poser » arme le modèle (aPoser)', etat.ui().aPoser === 'K1');
      cliquerCellule(3, 3);
      ctrl('deux clics : pose en (3,3) avec la rotation suggérée du coin SE, armement levé', nbTuiles() === 1 && M.tuileEn(etat.doc(), 3, 3).rot === 2 && !etat.ui().aPoser, msg());
      document.querySelector('[data-vignette="K2"] [data-action="poser"]').click();
      touche('Escape');
      ctrl('Échap désarme', !etat.ui().aPoser);
      var K3 = M.modeleParId(etat.doc(), 'K3').exemplaires;
      document.querySelector('[data-vignette="K3"] [data-action="plus"]').click();
      ctrl('bouton + : exemplaires +1', M.modeleParId(etat.doc(), 'K3').exemplaires === K3 + 1);
      document.querySelector('[data-vignette="K3"] [data-action="moins"]').click();
      document.querySelector('[data-vignette="K3"] [data-action="moins"]').click();
      ctrl('bouton − : retour à ' + K3 + ' puis ' + (K3 - 1), M.modeleParId(etat.doc(), 'K3').exemplaires === K3 - 1);
      document.querySelector('[data-vignette="K1"] [data-action="moins"]').click();   // 2 -> 1 exemplaire : accepté (1 tuile posée)
      document.querySelector('[data-vignette="K1"] [data-action="moins"]').click();
      ctrl('− sous le nombre de tuiles posées : refusé avec message', M.modeleParId(etat.doc(), 'K1').exemplaires === 1 && niveau() === 'erreur', msg());
      var sel = document.querySelector('[data-role="filtre"]');
      sel.value = 'coin'; sel.dispatchEvent(new Event('change', { bubbles: true }));
      ctrl('filtre « Coins » : 3 vignettes', document.querySelectorAll('.pm-biblio-vignette').length === 3, document.querySelectorAll('.pm-biblio-vignette').length);
      sel.value = 'bord'; sel.dispatchEvent(new Event('change', { bubbles: true }));
      ctrl('filtre « Bords » : 5 vignettes (B1, B3 à B6)', document.querySelectorAll('.pm-biblio-vignette').length === 5, document.querySelectorAll('.pm-biblio-vignette').length);
      sel.value = 'tous'; sel.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function boutonRole(libelle) {
      return Array.prototype.filter.call(document.querySelectorAll('.pm-editeur-boutons-roles button'), function (b) { return b.textContent === libelle; })[0];
    }

    function s3_historique() {
      titre('S3 annuler / rétablir');
      reset();
      var s0 = docJ();
      glisser('C1', 1, 1);
      var s1 = docJ();
      ctrl('pose faite, Annuler actif', s1 !== s0 && !$('btn-annuler').disabled);
      ctrlZ();
      ctrl('Ctrl+Z : retour exact à l\'état vide', docJ() === s0 && !$('btn-retablir').disabled);
      ctrlY();
      ctrl('Ctrl+Y : retour exact à la pose', docJ() === s1);
      $('btn-annuler').click();
      ctrl('bouton Annuler', docJ() === s0);
      $('btn-retablir').click();
      ctrl('bouton Rétablir', docJ() === s1);
      ctrlZ(); touche('z', { ctrlKey: true, shiftKey: true });
      ctrl('Ctrl+Maj+Z rétablit', docJ() === s1);
      cliquerCellule(1, 1);
      touche('r');
      ctrl('R pivote la tuile sélectionnée', M.tuileEn(etat.doc(), 1, 1).rot === 1);
      ctrlZ();
      ctrl('Ctrl+Z annule la rotation (état identique)', docJ() === s1);
      ctrlY();
      ctrl('Ctrl+Y refait la rotation', M.tuileEn(etat.doc(), 1, 1).rot === 1);
      ctrlZ();
      reset(Object.assign({}, docComplet, { plateau: Object.assign({}, docComplet.plateau, { jetons: [] }) }));
      var sj0 = docJ();
      cliquerJonction(1, 1);
      var sj1 = docJ();
      ctrl('clic jonction : ville posée', etat.doc().plateau.jetons.length === 1 && etat.doc().plateau.jetons[0].type === 'capture', msg());
      cliquerJonction(1, 1);
      ctrl('2e clic : la jonction redevient une case chemin', etat.doc().plateau.jetons.length === 0 && /case chemin/.test(msg()), msg());
      ctrlZ(); ctrlZ();
      ctrl('2 × Ctrl+Z : état initial exact', docJ() === sj0);
      ctrlY();
      ctrl('Ctrl+Y : ville de nouveau', docJ() === sj1);
      reset();
      etat.majUi({ modeleSelectionne: 'K1', onglet: 'tuiles' });
      var sel = document.querySelector('.pm-editeur-canevas');

      ctrl('plateau complet assemblé par l\'interface : identique après aller-retour', CJ(r.doc) === CJ(etat.doc()));
      ['', '{', 'null', '[]', '{"format":"autre"}', '{"format":"plateau-modulaire","version":2,"modeles":"x"}', t.slice(0, t.length - 20)].forEach(function (mauvais, k) {
        var res;
        try { res = S.depuisJSON(mauvais); } catch (e) { res = { exception: e.message }; }
        ctrl('fichier corrompu #' + k + ' : pas d\'exception, ok:false ou ouvert prudemment', !res.exception && (res.ok === false ? (res.erreurs && res.erreurs.length && res.erreurs[0].message) : !!res.doc), J(res).slice(0, 120));
      });
      var orig = S.ouvrirFichier, avant = docJ();
      S.ouvrirFichier = function () { return Promise.resolve(S.depuisJSON('{')); };
      $('btn-ouvrir').click();
      return attendre(50).then(function () {
        ctrl('Ouvrir un fichier corrompu : message d\'erreur, document intact', niveau() === 'erreur' && docJ() === avant, msg());
        S.ouvrirFichier = function () { return Promise.resolve(S.depuisJSON(t)); };
        reset();
        $('btn-ouvrir').click();
        return attendre(50);
      }).then(function () {
        ctrl('Ouvrir un fichier valide : document remplacé', nbTuiles() === 16, nbTuiles());
        var apresOuv = docJ();
        ctrlZ();
        ctrl('Ouvrir est annulable (Ctrl+Z restaure le document précédent)', nbTuiles() === 0);
        ctrlY();
        ctrl("Ctrl+Y après l'annulation de l'ouverture", docJ() === apresOuv);
        S.ouvrirFichier = function () { return Promise.resolve(S.depuisJSON(texteV1())); };
        $('btn-ouvrir').click();
        return attendre(50);
      }).then(function () {
        ctrl('Ouvrir un document de la version 1 : converti (version 2, plus de carrefour ni de forme), une phrase le dit',
          etat.doc().version === 2 && etat.doc().plateau.jetons.length === 0 && !('forme' in etat.doc().plateau) &&
          M.modeleParId(etat.doc(), 'A1').gabarit === 'bord' && /version 1 converti/.test(msg()), msg());
        S.ouvrirFichier = orig;
        reset(docComplet);
        etat.signaler('', 'info');
        cliquerJonction(1, 2);
        return attendre(1300);
      }).then(function () {
        var brut = null; try { brut = localStorage.getItem(S.CLE_AUTOSAVE); } catch (e) { /* ignoré */ }
        ctrl('autosave écrite dans localStorage après modification', typeof brut === 'string', typeof brut);
        var rr = S.restaurerAutosave();
        ctrl('restaurerAutosave : ok, identique au document courant', rr && rr.ok && CJ(rr.doc) === docJ(), rr && J(rr).slice(0, 100));
        var nouveau = PM.etat.creer(rr.doc);
        var cont = {};
        ['bibliotheque', 'assemblage', 'controles', 'editeur'].forEach(function (n) { cont[n] = document.createElement('div'); document.body.appendChild(cont[n]); });
        PM.bibliotheque.monter(cont.bibliotheque, nouveau);
        PM.assemblage.monter(cont.assemblage, nouveau);
        PM.controles.monter(cont.controles, nouveau);
        PM.editeurTuile.monter(cont.editeur, nouveau);
        ctrl('remontage : 16 tuiles et 8 villes dessinées', cont.assemblage.querySelectorAll('.pm-assemblage-occupee').length === 16 && cont.assemblage.querySelectorAll('.pm-assemblage-jeton').length === 8, cont.assemblage.querySelectorAll('.pm-assemblage-jeton').length);
        ctrl('remontage : bibliothèque de 3 vignettes et 7 compteurs', cont.bibliotheque.querySelectorAll('.pm-biblio-vignette').length === 3 && cont.controles.querySelectorAll('.pm-controles-compteur').length === 7);
        ctrl('remontage : état neuf sans historique', !nouveau.peutAnnuler());
        localStorage.setItem(S.CLE_AUTOSAVE, '{pas du json');
        ctrl('autosave corrompue : restaurerAutosave renvoie null sans exception', S.restaurerAutosave() === null);
        localStorage.setItem(S.CLE_AUTOSAVE, texteV1());
        var v1 = S.restaurerAutosave();
        ctrl('autosave de la version 1 : relue convertie, avec la phrase de migration', v1 && v1.ok && v1.doc.version === 2 && v1.alertes[0].code === 'migration_v1');
        S.effacerAutosave();
        ctrl('effacerAutosave', S.restaurerAutosave() === null);
        cont.bibliotheque.remove(); cont.assemblage.remove(); cont.controles.remove(); cont.editeur.remove();
      });
    }

    /** (Avant s6_sauvegarde, qui remonte les modules et remplace l'instance de glissement.) Nouveau → 5×5 : choix de la grille, refus si le catalogue 5×5 manque, pose, camps, mélange refusé, annulation. */
    function s8_nouveau5x5() {
      titre('S9 Nouveau → 5×5 (modèles d\'essai 5×5 : le catalogue 5×5 n\'est pas requis)');
      var origine = PM.catalogue.nouveauDocument;
      function dialogueOuvert() { return $('dialogue').open; }
      function choisir(id) { var r = document.querySelector('#dialogue-contenu input[name="pm-nouveau-grille"][value="' + id + '"]'); r.checked = true; }
      function creer() { document.querySelector('#dialogue-contenu .pm-nouveau-creer').click(); }
      function restaurer() { PM.catalogue.nouveauDocument = origine; }
      try {
        reset(docExemples('4x4'));
        ctrl('indicateur de grille en 4×4', $('indicateur-grille').textContent === 'Grille 4×4 · 48 × 48 cm', $('indicateur-grille').textContent);
        $('btn-nouveau').click();
        var cont = $('dialogue-contenu'), radios = cont.querySelectorAll('input[name="pm-nouveau-grille"]');
        ctrl('Nouveau : la boîte de dialogue s\'ouvre avec deux choix, 4×4 coché', dialogueOuvert() && radios.length === 2 && radios[0].value === '4x4' && radios[0].checked && !radios[1].checked);
        ctrl('Nouveau : dimensions et tuiles de chaque grille', /48 × 48 cm, tuiles de 12 cm/.test(cont.textContent) && /50 × 50 cm, tuiles de 10 cm/.test(cont.textContent), cont.textContent);
        ctrl('Nouveau : avertissement de remplacement et Ctrl+Z', /seront remplacés/.test(cont.textContent) && /Ctrl\+Z/.test(cont.textContent));
        // catalogue qui ne connaît pas encore le 5×5 : il renvoie du 4×4
        PM.catalogue.nouveauDocument = function () { return docExemples('4x4'); };
        var avant = docJ();
        choisir('5x5'); creer();
        var err = cont.querySelector('.pm-nouveau-erreur');
        ctrl('catalogue sans 5×5 : refus expliqué dans la boîte, plateau intact', dialogueOuvert() && err && !err.hidden && /5×5.*pas encore disponible/.test(err.textContent) && docJ() === avant, err && err.textContent);
        ctrl('catalogue sans 5×5 : message d\'erreur dans la barre d\'état', niveau() === 'erreur' && uneSeulePhrase(msg()), msg());
        cont.querySelector('.pm-nouveau-annuler').click();
        ctrl('Annuler ferme la boîte sans rien changer', !dialogueOuvert() && docJ() === avant);
        // catalogue qui sait faire du 5×5 (modèles d'essai)
        PM.catalogue.nouveauDocument = function (g) { return docExemples(g === '5x5' ? '5x5' : '4x4'); };
        $('btn-nouveau').click();
        choisir('5x5'); creer();
        ctrl('Créer 5×5 : boîte fermée, document 5×5 sans tuile', !dialogueOuvert() && etat.doc().grille === '5x5' && nbTuiles() === 0);
        ctrl('indicateur de grille en 5×5', $('indicateur-grille').textContent === 'Grille 5×5 · 50 × 50 cm', $('indicateur-grille').textContent);
        ctrl('plateau 5×5 : 25 cellules et 16 jonctions', document.querySelectorAll('[data-cellule]').length === 25 && document.querySelectorAll('[data-jonction]').length === 16);
        ctrl('plateau 5×5 : rangée centrale neutre affichée', document.querySelectorAll('[data-rangee-neutre]').length === 1 && /Neutre/.test(document.querySelector('#assemblage svg').textContent));
        ctrl('plateau 5×5 : étiquette d\'une cellule libre de la rangée centrale', /Bord, neutre/.test(document.querySelector('[data-cellule="0,2"]').getAttribute('aria-label')), document.querySelector('[data-cellule="0,2"]').getAttribute('aria-label'));
        ctrl('bibliothèque 5×5 : 3 vignettes', document.querySelectorAll('.pm-biblio-vignette').length === 3);
        var c = compteurs();
        ctrl('compteurs 5×5 : tuiles 0 / 25, apparitions 0 / 7 par camp, 50 × 50 cm', c['Tuiles posées'].v === '0 / 25' && c['Apparitions vert'].v === '0 / 7' && c['Apparitions rouge'].v === '0 / 7' && /50 × 50 cm/.test(c['Dimensions'].v), J(c));
        ctrl('Nouveau : message qui annonce Ctrl+Z', /5×5/.test(msg()) && /Ctrl\+Z/.test(msg()), msg());
        ctrlZ();
        ctrl('Ctrl+Z revient au plateau 4×4 (indicateur et 16 cellules)', etat.doc().grille === '4x4' && $('indicateur-grille').textContent === 'Grille 4×4 · 48 × 48 cm' && document.querySelectorAll('[data-cellule]').length === 16);
        ctrlY();
        ctrl('Ctrl+Y rétablit le plateau 5×5', etat.doc().grille === '5x5' && document.querySelectorAll('[data-cellule]').length === 25);
        // pose en 5×5 : coin au nord-ouest, bord dans la rangée neutre
        var g1 = glisser('ex-coin', 0, 0, 0), g2 = glisser('ex-bord', 0, 2, 0);
        ctrl('pose en 5×5 par glisser-déposer (coin en (0,0), bord en (0,2))', g1.demarre && g2.demarre && nbTuiles() === 2, J(g1) + J(g2) + nbTuiles() + ' ' + msg());
        ctrl('pose en 5×5 : rotations suggérées (coin 0, bord de l\'ouest 3)', M.tuileEn(etat.doc(), 0, 0).rot === 0 && M.tuileEn(etat.doc(), 0, 2).rot === 3, J(etat.doc().plateau.tuiles));
        c = compteurs();
        ctrl('apparition du coin vert comptée, celle de la rangée neutre ignorée', c['Apparitions vert'].v === '1 / 7' && c['Apparitions rouge'].v === '0 / 7', J(c));
        cliquerCellule(4, 2);
        ctrl('clic sur une cellule libre de la rangée neutre : « neutre » dans le message', /neutre/.test(msg()), msg());
        // mélange refusé : un modèle 4×4 dans une bibliothèque 5×5
        var m4 = JSON.parse(JSON.stringify(PM.modele.copieExemples('4x4')[1]));
        m4.id = 'ex4-bord'; m4.nom = 'Bord 4×4'; m4.exemplaires = 3;
        etat.appliquer(function (d) { var n = M.clonerDocument(d); n.modeles.push(m4); return n; }, 'ajout d\'un modèle 4×4');
        var vign = document.querySelector('.pm-biblio-vignette[data-vignette="ex4-bord"]');
        ctrl('mélange : la vignette du modèle 4×4 est grisée et badgée « grille 4×4 »', vign && /pm-biblio-autre-grille/.test(vign.className) && /grille 4×4/.test(vign.textContent) && vign.querySelector('.pm-biblio-poser').disabled);
        var avant2 = docJ(), g3 = glisser('ex4-bord', 2, 3, 0);
        ctrl('mélange : glisser le modèle 4×4 est refusé en une phrase, plateau intact', !g3.demarre && docJ() === avant2 && niveau() === 'erreur' && /grille 4×4/.test(msg()) && /plateau 5×5/.test(msg()) && uneSeulePhrase(msg()), msg());
        ctrl('mélange : aucune cellule ne s\'allume pour le modèle 4×4', A.cellulesCompatibles(etat.doc(), 'ex4-bord').length === 0);
      } finally {
        restaurer();
      }
      reset(docExemples('4x4'));
      ctrl('fin du scénario : retour à un plateau 4×4', etat.doc().grille === '4x4' && $('indicateur-grille').textContent === 'Grille 4×4 · 48 × 48 cm');
    }

    var chaine = Promise.resolve();
    function etape(f) { chaine = chaine.then(function () { try { return f(); } catch (e) { nEchec++; rapportEl.textContent += 'ÉCHEC  exception dans ' + f.name + ' : ' + (e && e.stack || e) + '\n'; } }); }
    if (!etat) { rapportEl.textContent = 'ÉCHEC  application non démarrée (PM.app.etat absent)\n'; nEchec++; }
    else {
      [s0_chargement, s1_assemblage, s2_refus, s3_historique, s4_editeur, s5_controles, s7_raccourcis, robustesse, s8_nouveau5x5, s6_sauvegarde].forEach(etape);
    }
    chaine.then(function () {
      var nErr = (document.getElementById('erreurs').textContent.match(/ERREUR JS/g) || []).length;
      ctrl('aucune erreur JavaScript pendant tout le parcours', nErr === 0, nErr + ' erreur(s)');
      rapportEl.textContent += '=== TOTAL : ' + nOk + ' OK, ' + nEchec + ' ÉCHEC ===\n';
      document.title = 'FIN ' + nOk + ' OK / ' + nEchec + ' ECHEC';
    });
  });
  </script>
</body>
